name: Update wallhops and deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wallhops-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download PC & Mobile rankings from NEW spreadsheet
        id: rankings
        continue-on-error: true
        env:
          WALLHOPS_SHEET_ID: '1IL_rmiXINST07Hb04RX3qpfQ2pM98FBqnxWwN4Xt7o0'
        run: |
          mkdir -p .build
          python scripts/sync_sheets.py --output .build/rankings.json

      - name: Keep prior rankings if sheet download fails
        if: steps.rankings.outcome == 'failure'
        run: |
          echo '::warning::Could not update rankings; preserving previous snapshot.'
          mkdir -p .build
          cp data/rankings.json .build/rankings.json

      - name: Track ranking changes
        if: steps.rankings.outcome == 'success'
        run: |
          if [ -f scripts/track_changes.py ]; then
            python scripts/track_changes.py --fresh .build/rankings.json --snapshot data/rankings.json --history data/changes.json
          fi

      - name: Download Victors from new spreadsheet (M-column notes)
        id: victors
        continue-on-error: true
        env:
          TTWL_VICTORS_SHEET_ID: '1RwF0kxkdXh_Fk49zBLWJx1pGxVBLEtnRJK74gvSwzWo'
        run: |
          mkdir -p .build
          python scripts/sync_victors.py --output .build/victors.json

      - name: Keep previous Victors if notes cannot be downloaded
        if: steps.victors.outcome == 'failure'
        run: |
          echo '::warning::Could not read Victor notes from XLSX; check source permissions and note export.'
          cp data/victors.json .build/victors.json

      - name: Save ranking history, if updated
        if: steps.rankings.outcome == 'success'
        run: |
          git add data/rankings.json data/changes.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update public rankings [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo '::warning::Cannot persist ranking history, but deploying current data.'
          fi

      - name: Assemble website (preserve existing CSS, JS, rules, favicon)
        run: |
          mkdir -p _site/data
          find . -maxdepth 1 -type f \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' -o -iname '*.ico' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.webp' \) -exec cp {} _site/ \;
          if [ -d data ]; then cp -a data/. _site/data/; fi
          cp .build/rankings.json _site/data/rankings.json
          cp .build/victors.json _site/data/victors.json
          python scripts/prepare_victors_site.py
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
