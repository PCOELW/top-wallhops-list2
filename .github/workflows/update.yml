name: TTWL - one original sheet (rankings + victors)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ttwl-original-sheet-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # This is the ONLY spreadsheet ID used for ALL data. Do not use the copy.
      TTWL_SOURCE_SHEET_ID: '1IL_rmiXINST07Hb04RX3qpfQ2pM98FBqnxWwN4Xt7o0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch PC and Mobile rankings from ORIGINAL sheet
        env:
          WALLHOPS_SHEET_ID: ${{ env.TTWL_SOURCE_SHEET_ID }}
        run: |
          mkdir -p .build
          python scripts/sync_sheets.py --output .build/rankings.json

      - name: Fetch Victors notes from SAME ORIGINAL sheet
        id: victors
        continue-on-error: true
        env:
          TTWL_VICTORS_SHEET_ID: ${{ env.TTWL_SOURCE_SHEET_ID }}
        run: |
          python scripts/sync_victors.py --output .build/victors.json

      - name: Do not reuse Victors from an unrelated sheet
        if: steps.victors.outcome != 'success'
        run: |
          echo '::warning::The ORIGINAL spreadsheet does not expose usable M-column Victor notes. Old data from the copied sheet will NOT be published.'
          python - <<'PY'
          import json, os
          from pathlib import Path
          sid = os.environ['TTWL_SOURCE_SHEET_ID']
          Path('.build/victors.json').write_text(json.dumps({
              'status':'unavailable',
              'sourceUrl': f'https://docs.google.com/spreadsheets/d/{sid}/edit',
              'pc':{}, 'mobile':{}, 'all':{},
              'message':'No Victor notes could be read from the original spreadsheet.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Assemble and validate SINGLE-SOURCE website
        run: |
          mkdir -p _site/data
          find . -maxdepth 1 -type f \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' -o -iname '*.ico' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.webp' \) -exec cp {} _site/ \;
          if [ -d data ]; then cp -a data/. _site/data/; fi
          cp .build/rankings.json _site/data/rankings.json
          cp .build/victors.json _site/data/victors.json
          python scripts/prepare_victors_site.py
          touch _site/.nojekyll

      - name: Add Google SEO and sitemap
        run: python scripts/add_seo.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
